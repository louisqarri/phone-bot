<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhoneBot - Smartphone Comparison</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    

</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand">📱 PhoneBot</a>
            <span class="text-muted">Smartphone Comparison Tool</span>
        </div>
    </nav>

    <!-- Hero -->
    <div class="hero">
        <h1>📱 PhoneBot</h1>
        <p>Compare smartphones or check full specs instantly</p>
    </div>

    <!-- Main Content -->
    <div class="container mt-5">

        <!-- Tab Buttons -->
        <div class="d-flex gap-3 mb-4 justify-content-center">
            <button class="tab-btn active" id="btn-compare" onclick="showTab('compare')">⚡ Compare Two Phones</button>
            <button class="tab-btn" id="btn-specs" onclick="showTab('specs')">🔍 Show Phone Specs</button>
        </div>

        <!-- Compare Tab -->
        <div id="tab-compare">
            <div class="card">
                <div class="card-header">⚡ Compare Two Smartphones</div>
                <div class="card-body p-4">
                    <div class="row g-3">
                        <div class="col-md-5">
                            <label class="form-label text-muted">First Phone</label>
                            <input type="text" class="form-control" id="phone1" placeholder="e.g. iPhone 17 Pro">
                        </div>
                        <div class="col-md-2 d-flex align-items-end justify-content-center">
                            <span class="vs-badge">VS</span>
                        </div>
                        <div class="col-md-5">
                            <label class="form-label text-muted">Second Phone</label>
                            <input type="text" class="form-control" id="phone2" placeholder="e.g. Galaxy S26 Ultra">
                        </div>
                    </div>
                    <div class="mt-3">
                        <button class="btn btn-primary px-4" onclick="comparePhones()">Compare Now</button>
                    </div>
                    <div class="result-box" id="compare-result">
                        <!-- Results will appear here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Specs Tab -->
        <div id="tab-specs" style="display:none;">
            <div class="card">
                <div class="card-header">🔍 View Full Specs</div>
                <div class="card-body p-4">
                    <label class="form-label text-muted">Phone Model</label>
                    <div class="d-flex gap-2">
                        <input type="text" class="form-control" id="phone-specs" placeholder="e.g. Pixel 10 Pro XL">
                        <button class="btn btn-primary px-4" onclick="showSpecs()">Show Specs</button>
                    </div>
                    <div class="result-box" id="specs-result">
                        <!-- Results will appear here -->
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <footer>
        <p>📱 PhoneBot — Built with Python & Flask</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function showTab(tab) {
            document.getElementById('tab-compare').style.display = tab === 'compare' ? 'block' : 'none';
            document.getElementById('tab-specs').style.display = tab === 'specs' ? 'block' : 'none';
            document.getElementById('btn-compare').className = tab === 'compare' ? 'tab-btn active' : 'tab-btn';
            document.getElementById('btn-specs').className = tab === 'specs' ? 'tab-btn active' : 'tab-btn';
        }

        function comparePhones() {
            const phone1 = document.getElementById('phone1').value;
            const phone2 = document.getElementById('phone2').value;
            const result = document.getElementById('compare-result');
            result.style.display = 'block';
            result.innerHTML = `<p class="text-muted">🔄 Comparing <strong>${phone1}</strong> vs <strong>${phone2}</strong>...</p>
                                <p class="text-muted">Connect this to your Flask backend to show real results!</p>`;
        }

        function showSpecs() {
            const phone = document.getElementById('phone-specs').value;
            const result = document.getElementById('specs-result');
            result.style.display = 'block';
            result.innerHTML = `<p class="text-muted">🔄 Loading specs for <strong>${phone}</strong>...</p>
                                <p class="text-muted">Connect this to your Flask backend to show real results!</p>`;
        }
    </script>

</body>
</html>
